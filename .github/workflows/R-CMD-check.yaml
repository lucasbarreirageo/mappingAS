# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# R CMD check on Linux, macOS and Windows.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Force HTTP/1.1 for package downloads. pak's HTTP/2 downloads are
      # occasionally truncated on the GitHub runners (notably macOS arm64),
      # which surfaces during dependency installation as
      # "Cannot extract <pkg>.tgz, unknown archive type". HTTP/1.1 avoids the
      # corrupted download and is otherwise harmless.
      PKGCACHE_HTTP_VERSION: "1.1"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          # The development pak has fixed several binary-extraction bugs; use it
          # only on macOS, where the "unknown archive type" failure occurs, so
          # the other platforms keep the stable pak.
          pak-version: ${{ matrix.config.os == 'macos-latest' && 'devel' || 'stable' }}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
